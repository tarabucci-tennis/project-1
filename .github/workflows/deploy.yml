name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # The deploy key lives in the DEPLOY_SSH_KEY secret. It may be stored
      # either as a raw PEM ("-----BEGIN ...") or base64-encoded (it was encoded
      # once so it could be pasted from a phone without newline corruption).
      # Accept either: if it already looks like a PEM, use it as-is; otherwise
      # base64-decode it. appleboy/ssh-action needs the raw PEM.
      - name: Prepare deploy SSH key
        env:
          RAW_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          {
            echo "DEPLOY_KEY<<__CR_EOF__"
            if printf '%s' "$RAW_KEY" | grep -q 'BEGIN'; then
              printf '%s\n' "$RAW_KEY"
            else
              printf '%s' "$RAW_KEY" | base64 -d
            fi
            echo "__CR_EOF__"
          } >> "$GITHUB_ENV"

      - name: Deploy to droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            if [ ! -d /root/app ]; then
              git clone https://github.com/tarabucci-tennis/project-1 /root/app
            fi
            cd /root/app
            git fetch origin main --quiet
            git reset --hard origin/main
            bash /root/app/bin/force-deploy.sh
